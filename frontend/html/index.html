<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traxxer</title>
  <script src="../../node_modules/wavesurfer.js/dist/wavesurfer.min.js"></script>
  <script src="../../node_modules/jsmediatags/dist/jsmediatags.min.js"></script>
  <script src="../js/bootstrap.min.js"></script>
  <script src="../../node_modules/essentia.js/dist/essentia-wasm.web.js"></script>
  <script src="../../node_modules/essentia.js/dist/essentia.js-core.js"></script>
  <script src="../js/loadPartials.js"></script>
  <style>
    ::-webkit-scrollbar { display: none; }

    /* Titlebar personalizada */
    #titlebar {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      background: #1a1a2e;
      padding: 0 8px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
    }

    #app-title {
      font-size: 13px;
      color: #aaa;
      font-family: sans-serif;
    }

    #size-controls,
    #window-controls {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 4px;
    }

    #titlebar button {
      -webkit-app-region: no-drag;
      background: transparent;
      border: none;
      color: #aaa;
      cursor: pointer;
      padding: 2px 8px;
      font-size: 14px;
      border-radius: 4px;
    }

    #titlebar button:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .size-btn.active {
      color: #fff;
      background: rgba(255,255,255,0.15);
    }

    /* Empurra o conteúdo para baixo da titlebar */
    body {
      margin-top: 32px;
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/header-waveforms.css">
  <link rel="stylesheet" href="../css/tracksbpms.css">
  <link rel="stylesheet" href="../css/decks.css">
  <link rel="stylesheet" href="../css/library.css">
</head>
<body>
  <div id="titlebar">
    <span id="app-title">Traxxer</span>
    <div id="size-controls">
      <button class="size-btn" data-size="small"  title="Compacto">⊡</button>
      <button class="size-btn" data-size="medium" title="Normal">⊟</button> <!-- Quanto tiver tempo, aplicar a lógica do virtualdj! -->
      <button class="size-btn" data-size="large"  title="Grande">⊞</button>
    </div>
    <div id="window-controls">
      <button id="btn-minimize">─</button>
      <button id="btn-close">✕</button>
    </div>
  </div>

  <!-- Partials -->
  <div data-include="./partials/header.html"></div>
  <div data-include="./partials/waveforms.html"></div>
  <div data-include="./partials/decks.html"></div>
  <div data-include="./partials/middledeck.html"></div>
  <div data-include="./partials/library.html"></div>
  <div data-include="./partials/alonecomponents.html"></div>

  <script>
    document.addEventListener('traxxer:partials-loaded', () => {
      // Botões de tamanho
      window.electronAPI.getWindowSize().then(size => {
        document.querySelector(`[data-size="${size}"]`)?.classList.add('active');
      });

      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const size = btn.dataset.size;
          window.electronAPI.setWindowSize(size);
          document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      // Botões de janela
      document.getElementById('btn-minimize').addEventListener('click', () => {
        window.electronAPI.minimizeWindow();
      });

      document.getElementById('btn-close').addEventListener('click', () => {
        window.electronAPI.closeWindow();
      });
    });
  </script>

</body>
</html>
