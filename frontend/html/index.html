<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traxxer</title>
  <script src="../../node_modules/wavesurfer.js/dist/wavesurfer.min.js"></script>
  <script src="../../node_modules/jsmediatags/dist/jsmediatags.min.js"></script>
  <script src="../js/bootstrap.min.js"></script>
  <script src="../../node_modules/essentia.js/dist/essentia-wasm.web.js"></script>
  <script src="../../node_modules/essentia.js/dist/essentia.js-core.js"></script>
  <script src="../js/loadPartials.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/header-waveforms.css">
  <link rel="stylesheet" href="../css/tracksbpms.css">
  <link rel="stylesheet" href="../css/decks.css">
  <link rel="stylesheet" href="../css/library.css">
  <link rel="stylesheet" href="../css/index.css">
</head>
<body>
  <div id="titlebar">

    <!-- Logo -->
    <div id="tb-logo">
      <img src="../assets/images/traxxer-logo.png" alt="Traxxer">
    </div>

    <div class="tb-sep"></div>

    <!-- Criar Conta -->
    <div class="tb-pill" id="tb-create-account">
      <i class="bi bi-person-fill"></i>
      <span>CRIAR CONTA</span>
    </div>

    <!-- No Ar -->
    <div class="tb-pill" id="tb-onair">
      <i class="bi bi-broadcast"></i>
      <span>NO AR</span>
    </div>

    <!-- Espaço central livre para drag -->
    <div id="tb-spacer"></div>

    <!-- CPU -->
    <div id="tb-cpu">
      <div class="tb-cpu-bar"><div class="tb-cpu-fill"></div></div>
      <span>CPU</span>
    </div>

    <!-- REC -->
    <div class="tb-pill" id="tb-rec">
      <i class="bi bi-circle-fill"></i>
      <span>REC</span>
    </div>

    <!-- Hora -->
    <div id="tb-time">
      <span id="tb-clock">00:00:00</span>
      <i class="bi bi-caret-down-square"></i>
    </div>

    <!-- Definições -->
    <div class="tb-pill" id="tb-settings">
      <i class="bi bi-gear-fill"></i>
      <span>DEFINIÇÕES</span>
    </div>

    <!-- Perfil -->
    <div id="tb-profile">
      <i class="bi bi-person-circle"></i>
    </div>

    <div class="tb-sep"></div>

    <!-- Tamanho da janela -->
    <div id="size-controls">
      <button class="size-btn" id="btn-cycle-size" title="Tamanho">⊟</button>
    </div>

    <!-- Minimizar / Fechar -->
    <div id="window-controls">
      <button id="btn-minimize">─</button>
      <button id="btn-close">✕</button>
    </div>

  </div>

  <!-- Partials -->
  <div data-include="./partials/waveforms.html"></div>
  <div data-include="./partials/decks.html"></div>
  <div data-include="./partials/middledeck.html"></div>
  <div data-include="./partials/library.html"></div>

  <script>
    document.addEventListener('traxxer:partials-loaded', () => {

      const sizeOrder = ['medium', 'large', 'small'];
      const sizeIcons = { small: '⊡', medium: '⊟', large: '⊞' };

      window.electronAPI.getWindowSize().then(size => {
        currentSize = size;
        document.getElementById('btn-cycle-size').textContent = sizeIcons[size];
      });

      let currentSize = 'medium';
      document.getElementById('btn-cycle-size').addEventListener('click', () => {
        const nextIndex = (sizeOrder.indexOf(currentSize) + 1) % sizeOrder.length;
        currentSize = sizeOrder[nextIndex];
        window.electronAPI.setWindowSize(currentSize);
        document.getElementById('btn-cycle-size').textContent = sizeIcons[currentSize];
      });

      // Tamanho da janela
      window.electronAPI.getWindowSize().then(size => {
        document.querySelector(`[data-size="${size}"]`)?.classList.add('active');
      });

      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const size = btn.dataset.size;
          window.electronAPI.setWindowSize(size);
          document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      // Minimizar / Fechar
      document.getElementById('btn-minimize').addEventListener('click', () => window.electronAPI.minimizeWindow());
      document.getElementById('btn-close').addEventListener('click',    () => window.electronAPI.closeWindow());

      // Relógio
      function updateClock() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const el = document.getElementById('tb-clock');
        if (el) el.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      }
      updateClock();
      setInterval(updateClock, 1000);

    });
  </script>

</body>
</html>
