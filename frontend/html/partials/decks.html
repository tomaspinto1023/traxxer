            <style> 
                /*Jog wheel - colocar depois num ficheiro css - organizar isso mais para a frente*/
                

                #trk1-jog-wheel.jog-wheel:active {
                    cursor: grabbing;
                }

                #trk1-jog-wheel .jog-wheel-ring {
                    position: absolute;
                    inset: 0;
                    border-radius: 50%;
                    background: radial-gradient(circle at center, #28282c 58%, #28282c 58.5%, #34343b 67%, #18181b 68%, #09090b 100%);
                    box-shadow: inset 0 0 0 2px #5f5f6b, inset 0 0 18px rgba(0, 0, 0, 0.55), 0 8px 18px rgba(0, 0, 0, 0.35);
                }

                #trk1-jog-wheel .jog-wheel-label {
                    position: absolute;
                    inset: 28%;
                    border-radius: 50%;
                    background: #09090b;
                }

                #trk1-jog-wheel .jog-wheel-label::before {
                    content: '';
                    position: absolute;
                    top: -47%;
                    width: 4px;
                    height: 119%;
                    left: 85%;
                    transform: translateX(-50%) rotate(45deg);
                    border-radius: 1px;
                    background: rgba(179, 42, 234, 0.92);
                }

                #trk1-jog-wheel .jog-wheel-spindle {
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    width: 14px;
                    height: 14px;
                    transform: translate(-50%, -50%);
                    border-radius: 50%;
                    background: #b5b5bd;
                    box-shadow: 0 0 8px rgba(255,255,255,0.18);
                }

                #trk1-jog-wheel.is-playing .jog-wheel-label {
                    animation: trk1JogSpin 1.8s linear infinite;
                }

                #trk1-jog-wheel.is-scratching .jog-wheel-label,
                #trk1-jog-wheel.is-jogging .jog-wheel-label {
                    animation: none;
                }

                @keyframes trk1JogSpin {
                    from { transform: rotate(0deg); }
                    to { transform: rotate(360deg); }
                }
                </style>
