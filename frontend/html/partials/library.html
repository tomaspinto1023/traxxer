<section id="library"> <!--BIBLIOTECA + SIDE BAR-->
    <div id="music-library">
        <div id="search-bar-btn">
            <i id="search-bar-icon" class="bi bi-search"></i>
        </div>
        <div id="music-folders">
            <div id="folder-open-btn">
                <i class="bi bi-folder2-open"></i>
                <span>Abrir pasta</span>
            </div>
        </div>
    </div>
    <div id="base-library">
        <!--<div id="library-music-search-bar"></div>-->
    </div>
    <div id="library-scroll-bar">
        <div id="scroll-switch"></div>
    </div>
    <div id="side-bar">
        <div id="side-bar-main-line"></div>
        <div id="side-bar-app-classes">
            <i id="classes-logo" class="bi bi-mortarboard-fill"></i>
        </div>
        <div id="side-bar-app-info" class="botao-info-container">
            <i id="info-logo" class="bi bi-info-lg"></i>

            <div id="caixa-info-popup" class="info-popup-escondido">
                <textarea placeholder=""></textarea>
            </div>
            <style>
                /* Torna o botão o ponto de referência para o posicionamento da caixa */
                .botao-info-container {
                position: relative;
                display: inline-block;
                cursor: pointer;
                }

                /* Estilo da caixa flutuante (Popup) */
                .info-popup {
                position: absolute;
                top: 100%; /* Aparece logo abaixo do botão */
                left: 0;
                z-index: 100;
                margin-top: 8px;
                background-color: white;
                padding: 10px;
                border-radius: 8px;
                box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15); /* Sombra para dar efeito flutuante */
                border: 1px solid #e0e0e0;
                }

                /* O textarea dentro do popup */
                .info-popup textarea {
                width: 200px;
                height: 80px;
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-family: sans-serif;
                font-size: 13px;
                resize: none; /* Evita que o utilizador deforme o layout */
                outline: none;
                }

                .info-popup textarea:focus {
                border-color: #0066cc;
                }

                /* Classe utilitária para esconder */
                .escondido {
                display: none !important;
                }
            </style>
            <script>
                const botaoInfo = document.getElementById('side-bar-app-info');
                const popupInfo = document.getElementById('caixa-info-popup');

                // 1. Abre/Fecha ao clicar no botão
                botaoInfo.addEventListener('click', (event) => {
                popupInfo.classList.toggle('escondido');
                });

                // 2. Impede que o clique dentro da caixa de texto feche o popup por acidente
                popupInfo.addEventListener('click', (event) => {
                event.stopPropagation();
                });

                // 3. Opcional: Fecha o popup se clicar em qualquer outro lugar do ecrã
                document.addEventListener('click', (event) => {
                if (!botaoInfo.contains(event.target)) {
                    popupInfo.classList.add('escondido');
                }
                });
            </script>
        </div>
    </div>
    <footer class="footer"></footer>
</section>
