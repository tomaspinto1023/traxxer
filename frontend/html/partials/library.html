<section id="library"> <!--BIBLIOTECA + SIDE BAR-->
    <div id="music-library">
        <div id="search-bar-btn">
            <i id="search-bar-icon" class="bi bi-search"></i>
        </div>
        <div id="music-folders">
            <div id="folder-open-btn">
                <i class="bi bi-folder2-open"></i>
                <span>Abrir pasta</span>
            </div>
        </div>
    </div>
    <div id="base-library">
        <!--<div id="library-music-search-bar"></div>-->
    </div>
    <div id="library-scroll-bar">
        <div id="scroll-switch"></div>
    </div>
    <div id="side-bar">
        <div id="side-bar-main-line"></div>
        <div id="side-bar-app-classes">
            <i id="classes-logo" class="bi bi-mortarboard-fill"></i>
        </div>
        <div id="side-bar-app-info" class="botao-info-container">
            <i id="info-logo" class="bi bi-info-lg"></i>

            <div id="caixa-info-popup" class="info-popup escondido">
                <div class="info-popup-header">
                    <i class="bi bi-info-circle-fill"></i>
                    <span class="info-popup-title">Informação</span>
                    <button id="info-popup-close" class="info-popup-close" aria-label="Fechar">&times;</button>
                </div>
                <div class="info-popup-body">
                    <textarea placeholder=""></textarea>
                </div>
            </div>

            <style>
                .botao-info-container {
                    position: relative;
                    display: inline-block;
                }

                .info-popup {
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    width: 360px;
                    max-width: 90vw;
                    z-index: 1000;
                    background-color: white;
                    border-radius: 8px;
                    box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.25);
                    overflow: hidden;
                    font-family: sans-serif;
                }

                .info-popup-header {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    padding: 10px 12px;
                    background-color: #f3f3f3;
                    border-bottom: 1px solid #e0e0e0;
                }

                .info-popup-header i {
                    color: #d9534f;
                    font-size: 16px;
                }

                .info-popup-title {
                    flex: 1;
                    font-size: 14px;
                    font-weight: 600;
                    color: #222;
                }

                .info-popup-close {
                    border: none;
                    background: transparent;
                    font-size: 18px;
                    line-height: 1;
                    cursor: pointer;
                    color: #555;
                    padding: 0 4px;
                }

                .info-popup-close:hover {
                    color: #000;
                }

                .info-popup-body {
                    padding: 12px;
                }

                .info-popup-body textarea {
                    width: 100%;
                    height: 80px;
                    border: 1px solid #ccc;
                    border-radius: 4px;
                    font-family: sans-serif;
                    font-size: 13px;
                    resize: none;
                    outline: none;
                    box-sizing: border-box;
                }

                .info-popup-body textarea:focus {
                    border-color: #0066cc;
                }

                .escondido {
                    display: none !important;
                }
            </style>
        </div>
    </div>
    <footer class="footer"></footer>
</section>
